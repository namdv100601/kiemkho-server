services:
  postgres:
    image: postgres:16-alpine
    container_name: nhamay-pmkiemke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmkiemke
      POSTGRES_PASSWORD: pmkiemke
      POSTGRES_DB: pmkiemke
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pmkiemke -d pmkiemke']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
